name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Self-contained Lean project in lean/ (no Mathlib) — fast, cache-free build
      # of the Containers + Trajectory libraries.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "lean"

      # Certification: no `sorry` reaches any headline theorem.
      - name: Axiom certification (no sorry reaches the headline theorems)
        working-directory: lean
        run: |
          lake env lean Certify.lean 2>&1 | tee axioms.txt
          if grep -q "sorryAx" axioms.txt; then
            echo "::error::sorryAx reached a headline theorem — certification failed"
            exit 1
          fi
          for t in Trajectory.circularTraj_wf Trajectory.circularTraj_tau_bot Trajectory.honest_tau_e3 Trajectory.psi_mono Trajectory.psi_honest_e4; do
            if ! grep -q "'$t' depends on axioms" axioms.txt; then
              echo "::error::no axiom report for '$t' — name did not resolve (vacuous certification)"
              exit 1
            fi
          done
          echo "Certified: all headline theorems proved with no sorry."
